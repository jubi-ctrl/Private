<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農產品交易行情</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #eeede8;
    --text: #1a1a18; --text2: #6b6b66; --text3: #9b9b94;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --green: #1D9E75; --red: #c0392b; --gain: #27ae60;
    --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0efea; --text2: #9b9b94; --text3: #6b6b66;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { border-bottom: 0.5px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 10px; background: var(--bg); position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; font-weight: 500; }
  header .subtitle { font-size: 12px; color: var(--text3); margin-left: auto; }
  .icon-badge { width: 30px; height: 30px; background: var(--green); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
  select, button { height: 34px; padding: 0 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer; outline: none; transition: border-color 0.15s; }
  select:hover, button:hover { border-color: var(--green); }
  button { display: flex; align-items: center; gap: 6px; }
  button:active { opacity: 0.7; }

  .crop-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .crop-tab { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .crop-tab:hover { border-color: var(--green); color: var(--green); }
  .crop-tab.active { background: var(--green); border-color: var(--green); color: #fff; }

  .status-bar { font-size: 12px; color: var(--text3); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-ok { background: #1D9E75; }
  .dot-err { background: #E24B4A; }
  .dot-loading { background: #EF9F27; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .error-box { background: #fff8ec; border: 0.5px solid #f0d080; border-radius: var(--radius); padding: 0.75rem 1rem; font-size: 13px; color: #7a5500; margin-bottom: 1rem; display: flex; gap: 8px; align-items: flex-start; line-height: 1.6; }
  @media (prefers-color-scheme: dark) { .error-box { background: #2a2010; border-color: #5a4010; color: #e0b060; } }

  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .metric-card { background: var(--bg2); border-radius: var(--radius); padding: 0.75rem 1rem; }
  .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; }
  .metric-unit { font-size: 12px; color: var(--text3); font-weight: 400; }
  .metric-delta { font-size: 12px; margin-top: 2px; }
  .delta-up { color: var(--red); }
  .delta-down { color: var(--gain); }

  .chart-wrap { border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; background: var(--bg); margin-bottom: 1.25rem; }
  .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 0.5rem; font-size: 12px; color: var(--text2); align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

  .table-wrap { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg); }
  .table-header { padding: 0.75rem 1.25rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 0.75rem; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-size: 11px; color: var(--text3); font-weight: 500; text-align: left; padding: 8px 12px; background: var(--bg2); white-space: nowrap; border-bottom: 0.5px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 0.5px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg3); color: var(--text2); }
  .empty-state { padding: 2.5rem; text-align: center; color: var(--text3); font-size: 13px; }
  .source-note { font-size: 11px; color: var(--text3); margin-top: 1.5rem; text-align: right; }
  .source-note a { color: var(--green); text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="icon-badge"><i class="ti ti-leaf" aria-hidden="true"></i></div>
  <h1>農產品交易行情</h1>
  <span class="subtitle">資料來源：農業部開放資料平臺</span>
</header>

<main>
  <div class="controls">
    <select id="sel-market">
      <option value="">全部市場</option>
      <option value="台北一">台北一</option>
      <option value="台北二">台北二</option>
      <option value="台中">台中</option>
      <option value="台南">台南</option>
      <option value="高雄">高雄</option>
    </select>
    <select id="sel-days">
      <option value="7">近 7 天</option>
      <option value="14">近 14 天</option>
      <option value="30">近 30 天</option>
    </select>
    <button onclick="loadData()">
      <i class="ti ti-refresh" aria-hidden="true"></i> 重新整理
    </button>
  </div>

  <div class="crop-tabs" id="crop-tabs"></div>

  <div class="status-bar" role="status" aria-live="polite">
    <span class="dot dot-loading" id="status-dot"></span>
    <span id="status-text">載入中...</span>
  </div>

  <div id="error-area"></div>
  <div class="metric-grid" id="metrics"></div>

  <div class="chart-wrap">
    <div class="chart-legend" id="chart-legend"></div>
    <div style="position:relative; width:100%; height:260px;">
      <canvas id="priceChart" role="img" aria-label="農產品均價走勢折線圖"></canvas>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <span class="section-title" style="margin:0">交易明細</span>
      <span class="badge" id="row-count">-</span>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>日期</th><th>作物</th><th>市場</th>
            <th class="num">上價</th><th class="num">中價</th><th class="num">下價</th>
            <th class="num">均價</th><th class="num">交易量（kg）</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="8" class="empty-state">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <p class="source-note">
    <a href="https://data.moa.gov.tw/open_detail.aspx?id=037" target="_blank" rel="noopener">農業部開放資料平臺 — 農產品交易行情</a>
    ｜民國年格式，每日更新 6/8/10/11/12/22 時
  </p>
</main>

<script>
const CROPS = [
  { label: '香蕉',   key: '香蕉' },
  { label: '小番茄', key: '小番茄' },
  { label: '番茄',   key: '番茄' },
  { label: '紅龍果', key: '紅龍果' },
  { label: '百香果', key: '百香果' },
  { label: '芒果',   key: '芒果' },
  { label: '鳳梨',   key: '鳳梨' },
  { label: '西瓜',   key: '西瓜' },
];

let currentCrop = CROPS[0];
let allData = [];
let chartInstance = null;

function rocDate(d) {
  return `${d.getFullYear()-1911}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function dateRange(days) {
  const end = new Date(), start = new Date();
  start.setDate(end.getDate() - days + 1);
  return { start: rocDate(start), end: rocDate(end) };
}

function setStatus(state, msg) {
  document.getElementById('status-dot').className = 'dot dot-' + state;
  document.getElementById('status-text').textContent = msg;
}

function buildTabs() {
  document.getElementById('crop-tabs').innerHTML = CROPS.map(c =>
    `<button class="crop-tab${c.key===currentCrop.key?' active':''}" onclick="switchCrop('${c.key}')">${c.label}</button>`
  ).join('');
}

function switchCrop(key) {
  currentCrop = CROPS.find(c => c.key === key);
  buildTabs();
  renderAll();
}

async function loadData() {
  setStatus('loading', '載入中...');
  document.getElementById('error-area').innerHTML = '';

  const days = parseInt(document.getElementById('sel-days').value);
  const market = document.getElementById('sel-market').value;
  const { start, end } = dateRange(days);

  const params = new URLSearchParams({ StartDate: start, EndDate: end, '$top': 3000, '$skip': 0 });
  if (market) params.append('Market', market);

  try {
    const res = await fetch(`/api/farm?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    allData = Array.isArray(json) ? json : [];
    if (!allData.length) { setStatus('err', '查無資料，請調整條件'); return; }
    setStatus('ok', `${allData.length} 筆｜${new Date().toLocaleTimeString('zh-TW')}`);
    renderAll();
  } catch(e) {
    setStatus('err', '資料載入失敗：' + e.message);
    document.getElementById('error-area').innerHTML = `
      <div class="error-box">
        <i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:16px;flex-shrink:0;margin-top:1px"></i>
        <span>資料載入失敗（${e.message}）。請確認 Vercel 已正確部署，或稍後再試。</span>
      </div>`;
  }
}

function filterData() {
  const mkt = document.getElementById('sel-market').value;
  let d = allData.filter(r => r['作物名稱'] && r['作物名稱'].includes(currentCrop.key));
  if (mkt) d = d.filter(r => r['市場名稱'] === mkt);
  return d;
}

function avg(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

function renderAll() {
  const data = filterData();
  renderMetrics(data);
  renderChart(data);
  renderTable(data);
}

function renderMetrics(data) {
  const el = document.getElementById('metrics');
  if (!data.length) { el.innerHTML = ''; return; }
  const prices = data.map(r=>parseFloat(r['平均價'])||0).filter(v=>v>0);
  const vols   = data.map(r=>parseFloat(r['交易量'])||0);
  const mean = avg(prices), hi = Math.max(...prices), lo = Math.min(...prices);
  const totalVol = vols.reduce((a,b)=>a+b,0);
  const dates = [...new Set(data.map(r=>r['交易日期']))].sort();
  let deltaHtml = '';
  if (dates.length >= 2) {
    const pa = avg(data.filter(r=>r['交易日期']===dates[dates.length-2]).map(r=>parseFloat(r['平均價'])||0));
    const ca = avg(data.filter(r=>r['交易日期']===dates[dates.length-1]).map(r=>parseFloat(r['平均價'])||0));
    const delta = ca - pa;
    deltaHtml = `<div class="metric-delta ${delta>=0?'delta-up':'delta-down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(1)} 元 vs 前日</div>`;
  }
  el.innerHTML = `
    <div class="metric-card"><div class="metric-label">期間均價</div><div class="metric-value">${mean.toFixed(1)}<span class="metric-unit"> 元/kg</span></div>${deltaHtml}</div>
    <div class="metric-card"><div class="metric-label">最高價</div><div class="metric-value">${hi.toFixed(1)}<span class="metric-unit"> 元/kg</span></div></div>
    <div class="metric-card"><div class="metric-label">最低價</div><div class="metric-value">${lo.toFixed(1)}<span class="metric-unit"> 元/kg</span></div></div>
    <div class="metric-card"><div class="metric-label">總交易量</div><div class="metric-value">${(totalVol/1000).toFixed(0)}<span class="metric-unit"> 噸</span></div></div>`;
}

function renderChart(data) {
  const byDate = {};
  data.forEach(r => {
    const p = parseFloat(r['平均價'])||0;
    if (!p) return;
    (byDate[r['交易日期']] = byDate[r['交易日期']]||[]).push(p);
  });
  const labels = Object.keys(byDate).sort();
  const vals = labels.map(d => +avg(byDate[d]).toFixed(1));

  document.getElementById('chart-legend').innerHTML = `
    <div class="legend-item"><span class="legend-swatch" style="background:#1D9E75"></span><span>${currentCrop.label} 日均價（元/kg）</span></div>`;

  const ctx = document.getElementById('priceChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label: currentCrop.label, data: vals, borderColor:'#1D9E75', backgroundColor:'rgba(29,158,117,0.07)', borderWidth:2, pointRadius:3, pointHoverRadius:5, pointBackgroundColor:'#1D9E75', tension:0.35, fill:true }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{display:false}, tooltip:{callbacks:{label: c=>` ${c.parsed.y.toFixed(1)} 元/kg`}} },
      scales: {
        x: { ticks:{font:{size:11},color:'#888',autoSkip:true,maxTicksLimit:12}, grid:{display:false} },
        y: { ticks:{font:{size:11},color:'#888',callback:v=>v+' 元'}, grid:{color:'rgba(128,128,128,0.1)'} }
      }
    }
  });
}

function renderTable(data) {
  const sorted = [...data].sort((a,b)=>a['交易日期']>b['交易日期']?-1:1);
  document.getElementById('row-count').textContent = sorted.length + ' 筆';
  const tbody = document.getElementById('table-body');
  if (!sorted.length) { tbody.innerHTML='<tr><td colspan="8" class="empty-state">查無資料</td></tr>'; return; }
  tbody.innerHTML = sorted.slice(0,200).map(r=>`
    <tr>
      <td>${r['交易日期']||'-'}</td><td>${r['作物名稱']||'-'}</td><td>${r['市場名稱']||'-'}</td>
      <td class="num">${parseFloat(r['上價']||0).toFixed(1)}</td>
      <td class="num">${parseFloat(r['中價']||0).toFixed(1)}</td>
      <td class="num">${parseFloat(r['下價']||0).toFixed(1)}</td>
      <td class="num" style="font-weight:500">${parseFloat(r['平均價']||0).toFixed(1)}</td>
      <td class="num" style="color:var(--text3)">${Number(r['交易量']||0).toLocaleString()}</td>
    </tr>`).join('');
}

buildTabs();
loadData();
document.getElementById('sel-market').addEventListener('change', renderAll);
document.getElementById('sel-days').addEventListener('change', ()=>loadData());
</script>
</body>
</html>
